<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Processing</title>
        <script src="https://openprocessing.org/openprocessing_sketch.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.2/lib/p5.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.11.2/lib/addons/p5.sound.min.js"></script>
        {% load static %}
        <script src="{% static 'js/game.js' %}"></script>
        {% comment %} <link rel="stylesheet" type="text/css" href="{% static 'css/processing.css' %}"> {% endcomment %}
        <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #2D4889, #2FA2B8, #30CFD0);
            flex-direction: column; /* 垂直排序 */
        }
        .container {
            text-align: center;
            background: white; /* 白底 */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
            margin: 0 auto 20px;
        }
        #gameContainer {
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="spinner"></div>
            <p id="status-message">正在分析中...請稍候</p>
        </div>
        <div id="gameContainer"></div>
        <script type="text/javascript">
        function checkStatus() {
            const taskId = "{{ task_id }}"; // 從 Django 模板獲取 task_id
            fetch(`/p5js/check_task_status/${taskId}/`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'COMPLETED') {
                        // 若完成，導向結果頁面
                        window.location.href = `/p5js/${taskId}/show/`;
                    } else if (data.status === 'FAILED') {
                        // 若失敗，導向錯誤頁面
                        window.location.href = `/upload/status/`;
                    } else {
                        // 若未完成，保持當前頁面並繼續查詢
                        console.log('Status:', data.status);
                        document.getElementById("status-message").textContent = "正在分析中...請稍候";
                        setTimeout(checkStatus, 2000); // 2 秒後再次檢查
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // 初始化檢查狀態
        checkStatus();
        </script>
    </body>
</html>

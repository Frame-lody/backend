{% include "base_generic.html" %}
{% block title %}
    <title>模式選擇</title>
{% endblock title %}
{% block head %}
    {% load static %}
    <link rel="stylesheet"
          type="text/css"
          href="{% static 'css/select_mode.css' %}">
{% endblock head %}
{% block content %}
    <div class="container"  data-aos="fade-up" data-aos-easing="ease">
        <div class="mode-container">
            <div class="mode-box">
                <h2>一般模式</h2>
                <div class="button-container">
                    {% csrf_token %}
                    <div class="button-group">
                        <button class="image-button button-1" onclick="updateSketch('mySketch1.js')"></button>
                        <button class="image-button button-2" onclick="updateSketch('mySketch3.js')"></button>
                        <button class="image-button button-3" onclick="updateSketch('mySketch4.js')"></button>
                        <button class="image-button button-4" onclick="updateSketch('mySketch6.js')"></button>
                        <button class="image-button button-5" onclick="updateSketch('mySketch7.js')"></button>
                        <button class="image-button button-6" onclick="updateSketch('mySketch8.js')"></button>
                        <button class="image-button button-7" onclick="updateSketch('mySketch15.js')"></button>
                        <button class="image-button button-8" onclick="updateSketch('mySketch16.js')"></button>
                        <button class="image-button button-9" onclick="updateSketch('mySketch17.js')"></button>
                        <button class="image-button button-10"
                                onclick="updateSketch('mySketch18.js')"></button>
                    </div>
                </div>
            </div>
            <div class="mode-box">
                <h2>互動模式</h2>
                <div class="button-container">
                    <div class="button-group">
                        <button class="image-button button-11" onclick="updateSketch('mySketch2.js')"></button>
                        <button class="image-button button-12" onclick="updateSketch('mySketch5.js')"></button>
                        <button class="image-button button-13" onclick="updateSketch('mySketch9.js')"></button>
                        <button class="image-button button-14"
                                onclick="updateSketch('mySketch10.js')"></button>
                        <button class="image-button button-15"
                                onclick="updateSketch('mySketch11.js')"></button>
                        <button class="image-button button-16"
                                onclick="updateSketch('mySketch12.js')"></button>
                        <button class="image-button button-17"
                                onclick="updateSketch('mySketch13.js')"></button>
                        <button class="image-button button-18"
                                onclick="updateSketch('mySketch14.js')"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function updateSketch(sketchName) {
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            fetch('/p5js/update-sketch/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') // 確保有 CSRF Token
                },
                body: JSON.stringify({
                    sketch: sketchName,
                    task_id: '{{ task_id }}',
                    order_id: {{ order_id }}
                }),
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Failed to update the sketch');
                }
            })
            .then(data => {
                window.location.href = '/p5js/'+ '{{ task_id }}' + '/adjust/' + '{{ order_id }}'; // 跳轉到目標頁面
                console.log('Sketch updated successfully:', data);
            })
            .catch(error => {
                console.error('Error updating the sketch:', error);
            });
        }

        // Helper: 獲取 CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

    </script>
{% endblock content %}
